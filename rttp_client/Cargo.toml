[package]
name = "rttp_client"
version = "0.1.0"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "Rust http client lib"
homepage = "https://github.com/fewensa/rttp"
repository = "https://github.com/fewensa/rttp"
license = "MIT"
keywords = ["http"]
include = [
  "Cargo.toml",
  "**/*.rs",
  "README.md",
  "LICENSE"
]

readme = "README.md"
edition = "2021"

[dependencies]
tracing = "0.1.40"
socket2 = "0.5.6"
futures = "0.3.30"

url              = "2.5.2"
percent-encoding = "2.3.1"

mime       = "0.3.17"
mime_guess = "2.0.5"

rand     = "0.8.5"
socks    = "0.3.4"
base64   = "0.22.1"
flate2   = "1.0.30"
httpdate = "1.0.3"


native-tls       = { optional = true, version = "0.2.11" }
async-native-tls = { optional = true, version = "0.5.0" }

rustls           = { optional = true, version = "0.23.13" }
webpki-roots     = { optional = true, version = "0.26.6" }
async-rustls     = { optional = true, version = "0.4.1" }


[features]
default = []
async = []
tls-native  = ["native-tls", "async-native-tls"]
tls-rustls  = ["rustls", "webpki-roots", "async-rustls"]

