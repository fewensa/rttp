[package]
name = "rttp-server"
version = "0.2.0"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "Rust HTTP server lib"
homepage = "https://github.com/fewensa/rttp"
repository = "https://github.com/fewensa/rttp"
license = "MIT"
keywords = ["http"]
include = [
  "Cargo.toml",
  "**/*.rs",
  "README.md",
  "LICENSE"
]
readme = "README.md"
edition = "2021"

[dependencies]
httpdate = "1.0"
socket2 = "0.5"
rttp-protocol = { version = "0.1.0", path = "../rttp-protocol" }
