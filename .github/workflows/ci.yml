name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (default features)
        run: cargo test --workspace

      - name: Run rttp facade client tests (no default features)
        run: |
          cargo build -p rttp --no-default-features --features client
          cargo test -p rttp --no-default-features --features client

      - name: Run tests
        run: cargo test --all-features

  rttp-client-tls:
    name: RTTP client TLS (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exercise each mutually exclusive TLS backend independently.
        feature: [ tls-native, tls-rustls ]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run focused tests
        run: cargo test -p rttp_client --no-default-features --features ${{ matrix.feature }}

  rttp-client-feature-combinations:
    name: RTTP client feature checks (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - async,http2,tls-native
          - async,http2,tls-rustls
          - tls-native
          - tls-rustls
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check feature combination
        run: cargo check -p rttp_client --no-default-features --features ${{ matrix.features }}

      - name: Clippy feature combination
        run: cargo clippy -p rttp_client --no-default-features --features ${{ matrix.features }} -- -D warnings
